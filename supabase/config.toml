project_id = "hrnltxmwoaphgejckutk"

[auth]
enabled = true
site_url = "https://www.consultx.app"
additional_redirect_urls = [
  "https://www.consultx.app",
  "https://www.consultx.app/auth",
  "https://consultx.app",
  "https://consultx.app/auth",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(SUPABASE_AUTH_EMAIL_SMTP_PASS)"
admin_email = "noreply@consultx.app"
sender_name = "ConsultX"

[auth.web3.solana]
enabled = true

[auth.web3.ethereum]
enabled = true

