project_id = "hrnltxmwoaphgejckutk"

[auth]
enabled = true
site_url = "https://www.consultx.app"
additional_redirect_urls = [
  "https://www.consultx.app",
  "https://www.consultx.app/auth",
  "https://consultx.app",
  "https://consultx.app/auth",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(SUPABASE_AUTH_EMAIL_SMTP_PASS)"
admin_email = "noreply@consultx.app"
sender_name = "ConsultX"

[auth.web3.solana]
enabled = true

[auth.web3.ethereum]
enabled = true

[functions.fire-safety-chat]
verify_jwt = false

[functions.moyasar-create-subscription]
verify_jwt = false

[functions.moyasar-webhook]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

[functions.auto-trial]
verify_jwt = false

[functions.sbc-graph-indexer]
verify_jwt = false

[functions.cancel-subscription]
verify_jwt = false

[functions.admin-stats]
verify_jwt = false

[functions.corporate-trial]
verify_jwt = false

[functions.process-subscription-renewal]
verify_jwt = false

[functions.admin-manage-user]
verify_jwt = false

[functions.launch-trial-activate]
verify_jwt = false

[functions.get-public-case-tracking]
verify_jwt = false

# delete-account verifies the JWT itself (auth.getUser on the caller's token)
# and additionally requires an explicit { "confirm": "DELETE" } body, matching
# the convention used by the other functions in this project.
[functions.delete-account]
verify_jwt = false

[functions.send-contact-message]
verify_jwt = false

# synthetic-probe is called by pg_cron with its own constant-time x-probe-token
# gate (same shape as process-subscription-renewal's cron secret), so the
# platform JWT gate is off and the cron statement needs no anon key.
[functions.synthetic-probe]
verify_jwt = false

# gemini-diag is an owner/orchestrator-invoked diagnostic (Gemini model list +
# the live cachedContents API-shape probe). Same constant-time x-probe-token
# gate as synthetic-probe, which is the whole gate here — it is called by hand
# from a shell, not by pg_cron, so it carries no user session to verify.
[functions.gemini-diag]
verify_jwt = false
